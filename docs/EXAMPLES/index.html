<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog - guten demo</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px;
        }
        .post-preview {
            border-bottom: 1px solid #eee;
            padding: 20px 0;
        }
        h1 { color: #333; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .post-title { margin: 0; }
        .post-date { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>My Blog</h1>
    <p>Welcome to my blog powered by <a href="https://codeberg.org/efournierrobert/guten">guten</a>.</p>
    
    <!-- These tags will show post previews -->
    {{ blog }}
    {{ demo }}
    
    <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; color: #666;">
        <p>&copy; 2024 My Blog. Built with guten.</p>
    </footer>
</body>
</html>
