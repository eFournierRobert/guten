<!-- This include demonstrates tag previews inside an include file: the tag
     notations below are expanded when the include is loaded, before it is
     inserted anywhere, so this one snippet shows the same live post previews
     wherever it is included. -->
<!-- It lives at the end of the article template on purpose: the homepage
     already lists posts, and a "More from this site" block belongs where
     readers have just finished an article. -->
<aside class="tag-cloud">
    <h3>More from this site</h3>
    {{ demo }}
    {{ features }}
</aside>
