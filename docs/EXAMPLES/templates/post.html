<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="page">
        {{ include:navbar.html }}

        <article class="post">
            <header>
                <h1 class="post-title">{{ title }}</h1>
                <time class="post-date">{{ date }}</time>
            </header>

            <hr>

            <div class="post-content">
                {{ content }}
            </div>

            <aside class="post-sidebar">
                <h3>Blog Posts</h3>
                <!-- Tag notations also expand directly in post templates -->
                {{ blog }}
            </aside>
        </article>

        {{ include:tag-cloud.html }}

        {{ include:footer.html }}
    </div>
</body>
</html>
