<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ excerpt }}">
  <title>{{ title }} — Fieldnotes</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  {{ include:navbar.html }}
  <main id="main" class="article-page wrap">
    <a class="back-link" href="/#journal">← Back to the journal</a>
    <article class="article">
      <header class="article-header">
        <p class="eyebrow">Fieldnotes / <time datetime="{{ date }}">{{ date }}</time></p>
        <h1>{{ title }}</h1>
        <p class="standfirst">{{ excerpt }}</p>
      </header>
      <div class="prose">{{ content }}</div>
    </article>
    <div class="article-end"><span aria-hidden="true">✳</span><a class="text-link" href="/#journal">More from the journal →</a></div>
  </main>
  {{ include:footer.html }}
</body>
</html>
